# ==========================================
# APPLICATION
# ==========================================

spring.application.name=VEHICLE-SERVICE
server.port=8002


# ==========================================
# POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/driveease_db
spring.datasource.username=postgres
spring.datasource.password=Govardhan@2009


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# ==========================================
# SERVER
# ==========================================

server.error.include-message=always

# ==========================================
# INTERNAL SERVICE SECRET
# Shared with Booking Service for inter-service calls.
# Booking Service must send this value in X-Internal-Service-Secret header.
# ==========================================
internal.service.secret=DriveEaseInternalServiceSecret2026