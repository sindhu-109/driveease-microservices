# ==========================================
# APPLICATION
# ==========================================

spring.application.name=BOOKING-SERVICE
server.port=8003


# ==========================================
# POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/driveease_db
spring.datasource.username=postgres
spring.datasource.password=Govardhan@2009


# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# ==========================================
# FEIGN
# ==========================================

spring.cloud.openfeign.circuitbreaker.enabled=false


# ==========================================
# SERVER
# ==========================================

server.error.include-message=always

# ==========================================
# INTERNAL SERVICE SECRET
# Sent to Vehicle Service on inter-service status-update calls.
# Must match internal.service.secret in MS2-VEHICLE-SERVICE.
# ==========================================
internal.service.secret=DriveEaseInternalServiceSecret2026